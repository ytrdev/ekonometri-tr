name: Belge sitesi

# Ücretsiz planda Pages yalnızca herkese açık depolarda çalışır; depo gizliyken bu iş atlanır.
# configure-pages enablement: true, Pages kapalıysa GitHub Actions kaynağıyla açar.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  derle:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . mkdocs-material mkdocs-jupyter
      - run: python scripts/site_hazirla.py
      - run: mkdocs build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@v4
