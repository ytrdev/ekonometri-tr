[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ekonometri-tr"
version = "0.8.0"
description = "Türkçe ekonometri kütüphanesi. Tahmin, Türkçe yorum, varsayım testi ve Word raporu."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "ytrdev" }]
keywords = ["ekonometri", "econometrics", "regresyon", "türkçe", "istatistik", "eğitim", "OLS", "EKK"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Turkish",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
]
dependencies = ["numpy>=1.22", "pandas>=1.5", "scipy>=1.8", "patsy>=0.5.3", "python-docx>=1.1", "openpyxl>=3.1", "matplotlib>=3.6", "statsmodels>=0.14"]

[project.optional-dependencies]
spss = ["pyreadstat>=1.2"]
gelistirme = ["pytest>=7", "statsmodels>=0.14", "linearmodels>=6", "ruff>=0.5", "nbformat", "nbclient", "ipykernel", "matplotlib"]

[project.urls]
"Kaynak kod" = "https://github.com/ytrdev/ekonometri-tr"
"Hata bildir" = "https://github.com/ytrdev/ekonometri-tr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ekonometri"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning:statsmodels", "ignore::FutureWarning", "ignore:The design matrix is rank-deficient"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["defterler", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "UP007", "UP006", "UP035", "B905"]
